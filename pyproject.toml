[project]
name = "aiml-notebooks"
version = "0.1.0"
description = "A collection of AI/ML experiments, detailed recreations, and concept explorations for self-learning and reference"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "torch>=2.13,<2.14",
    "torchvision>=0.28,<0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
exclude-newer = "7 days"
constraint-dependencies = [
  "mistralai!=2.4.6",
  "guardrails-ai!=0.10.1",
  "bleach>=6.4",
  "mistune>=3.3",
  "pillow>=12.3",
  "setuptools>=83",
  "soupsieve>=2.8.4",
  "tornado>=6.5.7",
]
# Package enabled to allow shared utilities to be imported from notebooks
package = true

[tool.jupytext]
formats = "ipynb,py:percent"

[tool.hatch.build.targets.wheel]
packages = ["src/aiml_notebooks"]

# Note: PyTorch on macOS uses MPS (Metal Performance Shaders) for GPU acceleration
# CUDA is only available on Linux/Windows. For cross-platform compatibility,
# we use the standard PyPI packages which include MPS support on macOS.

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupytext>=1.19.1",
    "nbconvert>=7.17.1",
    "pytest>=9,<10",
    "ruff>=0.16.2,<0.17",
]
