[project]
name = "aiml-notebooks"
version = "0.1.0"
description = "A collection of AI/ML experiments, detailed recreations, and concept explorations for self-learning and reference"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "pillow",
    "torch>=2.0.0",
    "torchvision",
    "torchaudio",
    "transformers",
    "timm",
    "lightning",
    "jupyter",
    "jupyterlab",
    "ipython",
    "ipykernel",
    "graphviz",
    "imageio-ffmpeg",
    "python-dotenv",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "imbalanced-learn",
    "pandas",
    "wandb",
    "pyyaml",
    "datasets>=4.3.0",
    "gymnasium",
    "sentence-transformers",
    "faiss-cpu",
    "librosa",
    "soundfile",
    "lime",
    "shap",
    "scikit-image",
    "jiwer>=4.0.0",
    "modal>=1.2.3",
    "tiktoken",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Package enabled to allow shared utilities to be imported from notebooks
package = true
dev-dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/aiml_notebooks"]

# Note: PyTorch on macOS uses MPS (Metal Performance Shaders) for GPU acceleration
# CUDA is only available on Linux/Windows. For cross-platform compatibility,
# we use the standard PyPI packages which include MPS support on macOS.
